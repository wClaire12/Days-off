<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <!-- APP 图标 -->
  <link rel="apple-touch-icon" href="./D1FAC0F2-8F4D-4DC4-AC2F-4672F9ED307A.png">
  <link rel="icon" type="image/png" href="./D1FAC0F2-8F4D-4DC4-AC2F-4672F9ED307A.png">

  <meta name="apple-mobile-web-app-title" content="我的调休">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#f7f7f3">

  <title>我的调休</title>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    :root {
      --green: #4f9467;
      --green-dark: #397b53;
      --green-light: #edf6ef;
      --green-soft: #dfeee3;
      --cream: #f7f7f3;
      --white: #ffffff;
      --text: #1d1d1f;
      --secondary: #7d7d82;
      --line: #ededeb;
      --red: #c95c55;
      --red-light: #fbefee;
      --shadow: 0 4px 20px rgba(0,0,0,.045);
    }

    html {
      background: var(--cream);
    }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--text);
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "PingFang SC",
        "Microsoft YaHei",
        sans-serif;
    }

    button,
    input {
      font-family: inherit;
    }

    button {
      cursor: pointer;
    }

    .app {
      width: 100%;
      max-width: 680px;
      margin: 0 auto;
      padding:
        calc(22px + env(safe-area-inset-top))
        16px
        calc(50px + env(safe-area-inset-bottom));
    }

    /* 顶部 */

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 22px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 11px;
    }

    .brand-icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      object-fit: cover;
      box-shadow: 0 2px 10px rgba(0,0,0,.06);
    }

    .brand-title {
      font-size: 22px;
      line-height: 1.1;
      font-weight: 760;
      letter-spacing: -.4px;
    }

    .brand-subtitle {
      margin-top: 4px;
      color: var(--secondary);
      font-size: 12px;
    }

    /* 主余额 */

    .balance-card {
      position: relative;
      overflow: hidden;
      background: linear-gradient(
        145deg,
        #4d9365 0%,
        #65a879 100%
      );
      border-radius: 26px;
      padding: 24px 22px 22px;
      color: white;
      box-shadow: 0 10px 28px rgba(61,125,83,.16);
      margin-bottom: 14px;
    }

    .balance-card::after {
      content: "";
      position: absolute;
      width: 180px;
      height: 180px;
      border-radius: 50%;
      right: -65px;
      top: -80px;
      background: rgba(255,255,255,.08);
    }

    .balance-label {
      position: relative;
      z-index: 1;
      font-size: 13px;
      opacity: .88;
    }

    .balance-main {
      position: relative;
      z-index: 1;
      display: flex;
      align-items: baseline;
      gap: 7px;
      margin-top: 8px;
    }

    .balance-number {
      font-size: 52px;
      line-height: 1;
      font-weight: 780;
      letter-spacing: -2px;
    }

    .balance-unit {
      font-size: 17px;
      font-weight: 600;
      opacity: .9;
    }

    .balance-days {
      position: relative;
      z-index: 1;
      margin-top: 8px;
      font-size: 13px;
      opacity: .8;
    }

    .balance-divider {
      height: 1px;
      background: rgba(255,255,255,.18);
      margin: 21px 0 17px;
    }

    .balance-stats {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }

    .balance-stat + .balance-stat {
      border-left: 1px solid rgba(255,255,255,.18);
      padding-left: 22px;
    }

    .balance-stat-label {
      font-size: 12px;
      opacity: .72;
    }

    .balance-stat-value {
      margin-top: 4px;
      font-size: 19px;
      font-weight: 700;
    }

    /* 快捷按钮 */

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-bottom: 14px;
    }

    .quick-button {
      border: 0;
      min-height: 58px;
      border-radius: 18px;
      font-size: 15px;
      font-weight: 700;
      transition: transform .12s ease;
    }

    .quick-button:active {
      transform: scale(.98);
    }

    .quick-add {
      background: var(--green);
      color: white;
    }

    .quick-leave {
      background: white;
      color: var(--text);
      box-shadow: var(--shadow);
    }

    .quick-symbol {
      font-size: 20px;
      vertical-align: -1px;
      margin-right: 3px;
    }

    /* 通用卡片 */

    .card {
      background: white;
      border-radius: 22px;
      padding: 19px;
      margin-bottom: 14px;
      box-shadow: var(--shadow);
    }

    .section-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .section-title {
      font-size: 16px;
      font-weight: 730;
    }

    .section-note {
      color: var(--secondary);
      font-size: 12px;
    }

    /* 输入表单 */

    .entry-card {
      display: none;
    }

    .entry-card.show {
      display: block;
      animation: appear .18s ease;
    }

    @keyframes appear {
      from {
        opacity: 0;
        transform: translateY(-4px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .entry-title {
      font-size: 18px;
      font-weight: 740;
      margin-bottom: 17px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 11px;
    }

    .field {
      margin-bottom: 12px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      display: block;
      color: var(--secondary);
      font-size: 12px;
      margin: 0 0 7px 2px;
    }

    input {
      width: 100%;
      height: 48px;
      border: 1px solid #e4e4e1;
      border-radius: 14px;
      background: #fafaf8;
      color: var(--text);
      padding: 0 13px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #92bda0;
      background: white;
      box-shadow: 0 0 0 3px rgba(79,148,103,.08);
    }

    .form-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 3px;
    }

    .button {
      border: 0;
      min-height: 47px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
    }

    .button-primary {
      background: var(--green);
      color: white;
    }

    .button-secondary {
      background: #f0f0ee;
      color: var(--text);
    }

    /* 本月 */

    .month-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .month-item {
      background: #f8f8f6;
      border-radius: 17px;
      padding: 15px;
    }

    .month-item-label {
      color: var(--secondary);
      font-size: 12px;
    }

    .month-item-value {
      margin-top: 6px;
      font-size: 22px;
      font-weight: 740;
    }

    .month-item-value.green {
      color: var(--green-dark);
    }

    /* 记录 */

    .record {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      padding: 14px 0;
      border-bottom: 1px solid var(--line);
    }

    .record:first-child {
      padding-top: 2px;
    }

    .record:last-child {
      padding-bottom: 2px;
      border-bottom: 0;
    }

    .record-left {
      display: flex;
      align-items: center;
      gap: 11px;
      min-width: 0;
    }

    .record-icon {
      flex: 0 0 auto;
      width: 38px;
      height: 38px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
      font-weight: 700;
    }

    .record-icon.add {
      color: var(--green-dark);
      background: var(--green-light);
    }

    .record-icon.leave {
      color: var(--red);
      background: var(--red-light);
    }

    .record-info {
      min-width: 0;
    }

    .record-type {
      font-size: 14px;
      font-weight: 680;
    }

    .record-meta {
      max-width: 250px;
      margin-top: 4px;
      color: var(--secondary);
      font-size: 11px;
      overflow: hidden;
      white-space: nowrap;
      text-overflow: ellipsis;
    }

    .record-right {
      flex: 0 0 auto;
      text-align: right;
    }

    .record-amount {
      font-size: 16px;
      font-weight: 740;
    }

    .record-amount.plus {
      color: var(--green-dark);
    }

    .record-amount.minus {
      color: var(--red);
    }

    .record-tools {
      display: flex;
      justify-content: flex-end;
      gap: 9px;
      margin-top: 5px;
    }

    .record-tool {
      border: 0;
      padding: 0;
      background: transparent;
      color: #a0a0a4;
      font-size: 10px;
    }

    .empty {
      padding: 22px 0 12px;
      text-align: center;
      color: #a0a0a4;
      font-size: 13px;
    }

    /* 数据工具 */

    .data-tools {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
    }

    .small-button {
      border: 0;
      border-radius: 12px;
      padding: 9px 11px;
      background: #f3f3f1;
      color: #55555a;
      font-size: 12px;
      font-weight: 600;
    }

    .privacy {
      margin-top: 12px;
      color: #aaa;
      font-size: 10px;
      line-height: 1.6;
    }

    /* 编辑弹窗 */

    .modal {
      position: fixed;
      inset: 0;
      z-index: 999;
      display: none;
      align-items: flex-end;
      justify-content: center;
      background: rgba(0,0,0,.3);
      backdrop-filter: blur(2px);
      -webkit-backdrop-filter: blur(2px);
    }

    .modal.show {
      display: flex;
    }

    .sheet {
      width: 100%;
      max-width: 680px;
      background: white;
      border-radius: 25px 25px 0 0;
      padding: 22px 17px
        calc(22px + env(safe-area-inset-bottom));
    }

    .sheet-handle {
      width: 38px;
      height: 4px;
      border-radius: 4px;
      background: #ddd;
      margin: -7px auto 18px;
    }

    .sheet-title {
      font-size: 19px;
      font-weight: 740;
      margin-bottom: 18px;
    }

    @media (min-width: 700px) {
      .app {
        padding-top: 35px;
      }

      .modal {
        align-items: center;
        padding: 20px;
      }

      .sheet {
        max-width: 500px;
        border-radius: 25px;
        padding: 25px;
      }

      .sheet-handle {
        display: none;
      }
    }

    @media (max-width: 380px) {
      .balance-number {
        font-size: 46px;
      }

      .brand-title {
        font-size: 20px;
      }

      .record-meta {
        max-width: 170px;
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- 顶部 -->
  <div class="topbar">
    <div class="brand">
      <img
        class="brand-icon"
        src="./D1FAC0F2-8F4D-4DC4-AC2F-4672F9ED307A.png"
        alt="我的调休"
      >
      <div>
        <div class="brand-title">我的调休</div>
        <div class="brand-subtitle">轻松记下每一次加班与休息</div>
      </div>
    </div>
  </div>

  <!-- 当前余额 -->
  <div class="balance-card">

    <div class="balance-label">当前可调休</div>

    <div class="balance-main">
      <div class="balance-number" id="balanceNumber">0</div>
      <div class="balance-unit">小时</div>
    </div>

    <div class="balance-days" id="balanceDays">
      ≈ 0天 0小时
    </div>

    <div class="balance-divider"></div>

    <div class="balance-stats">

      <div class="balance-stat">
        <div class="balance-stat-label">累计加班</div>
        <div class="balance-stat-value" id="earned">0 h</div>
      </div>

      <div class="balance-stat">
        <div class="balance-stat-label">累计已休</div>
        <div class="balance-stat-value" id="used">0 h</div>
      </div>

    </div>
  </div>

  <!-- 快捷操作 -->
  <div class="quick-actions">

    <button
      class="quick-button quick-add"
      id="addOvertime"
    >
      <span class="quick-symbol">＋</span>
      记录加班
    </button>

    <button
      class="quick-button quick-leave"
      id="addLeave"
    >
      <span class="quick-symbol">－</span>
      记录调休
    </button>

  </div>

  <!-- 新增记录 -->
  <div class="card entry-card" id="entryForm">

    <div class="entry-title" id="formTitle">
      记录加班
    </div>

    <div class="form-grid">

      <div class="field">
        <label>日期</label>
        <input type="date" id="dateInput">
      </div>

      <div class="field">
        <label>时长（小时）</label>
        <input
          type="number"
          id="hoursInput"
          min="0.25"
          step="0.25"
          inputmode="decimal"
          placeholder="例如 2"
        >
      </div>

      <div class="field full">
        <label>备注（可选）</label>
        <input
          type="text"
          id="noteInput"
          maxlength="80"
          placeholder="例如：晚上加班 / 下午调休"
        >
      </div>

    </div>

    <div class="form-actions">

      <button
        class="button button-secondary"
        id="cancelEntry"
      >
        取消
      </button>

      <button
        class="button button-primary"
        id="saveEntry"
      >
        保存
      </button>

    </div>

  </div>

  <!-- 本月统计 -->
  <div class="card">

    <div class="section-head">
      <div class="section-title">本月统计</div>
      <div class="section-note" id="monthText"></div>
    </div>

    <div class="month-grid">

      <div class="month-item">
        <div class="month-item-label">本月加班</div>
        <div
          class="month-item-value green"
          id="monthEarned"
        >
          0 h
        </div>
      </div>

      <div class="month-item">
        <div class="month-item-label">本月调休</div>
        <div
          class="month-item-value"
          id="monthUsed"
        >
          0 h
        </div>
      </div>

    </div>

  </div>

  <!-- 最近记录 -->
  <div class="card">

    <div class="section-head">
      <div class="section-title">最近记录</div>
    </div>

    <div id="records"></div>

    <div class="data-tools">

      <button
        class="small-button"
        id="setInitial"
      >
        设置初始余额
      </button>

      <button
        class="small-button"
        id="exportData"
      >
        导出备份
      </button>

      <button
        class="small-button"
        id="importData"
      >
        导入备份
      </button>

    </div>

    <div class="privacy">
      数据仅保存在当前浏览器中，不会上传到服务器。
      更换手机或清理浏览器数据前，建议先导出备份。
    </div>

  </div>

</div>


<!-- 编辑记录弹窗 -->
<div class="modal" id="editModal">

  <div class="sheet">

    <div class="sheet-handle"></div>

    <div class="sheet-title">
      编辑记录
    </div>

    <div class="field">
      <label>日期</label>
      <input type="date" id="editDate">
    </div>

    <div class="field">
      <label>时长（小时）</label>
      <input
        type="number"
        id="editHours"
        min="0.25"
        step="0.25"
      >
    </div>

    <div class="field">
      <label>备注</label>
      <input
        type="text"
        id="editNote"
        maxlength="80"
      >
    </div>

    <div class="form-actions">

      <button
        class="button button-secondary"
        id="cancelEdit"
      >
        取消
      </button>

      <button
        class="button button-primary"
        id="saveEdit"
      >
        保存修改
      </button>

    </div>

  </div>

</div>


<input
  type="file"
  id="fileInput"
  accept=".json,application/json"
  hidden
>


<script>

  /*
   * 保留原来的存储名称。
   * 所以更换新版页面后，
   * 以前已经记录的数据仍然可以继续读取。
   */

  const RECORD_KEY = "my_timeoff_records_v1";
  const INITIAL_KEY = "my_timeoff_initial_v1";

  let currentType = "加班";
  let editingId = null;

  const $ = id => document.getElementById(id);


  /* =========================
     数据读取
  ========================= */

  function loadRecords() {

    try {

      return JSON.parse(
        localStorage.getItem(RECORD_KEY) || "[]"
      );

    } catch (e) {

      return [];

    }

  }


  function saveRecords(data) {

    localStorage.setItem(
      RECORD_KEY,
      JSON.stringify(data)
    );

  }


  function getInitial() {

    return Number(
      localStorage.getItem(INITIAL_KEY) || 0
    );

  }


  /* =========================
     数字处理
  ========================= */

  function formatNumber(number) {

    const n =
      Math.round(
        (Number(number) + Number.EPSILON) * 100
      ) / 100;

    return String(n);

  }


  function hoursToDays(hours) {

    const negative = hours < 0;

    const absolute = Math.abs(hours);

    const days = Math.floor(absolute / 8);

    const rest =
      Math.round(
        (absolute % 8) * 100
      ) / 100;

    return (
      (negative ? "-" : "") +
      days +
      "天 " +
      formatNumber(rest) +
      "小时"
    );

  }


  function escapeHtml(text) {

    return String(text || "")
      .replace(/[&<>"']/g, function(character) {

        return {

          "&": "&amp;",
          "<": "&lt;",
          ">": "&gt;",
          '"': "&quot;",
          "'": "&#39;"

        }[character];

      });

  }


  /* =========================
     主页面刷新
  ========================= */

  function render() {

    const data = loadRecords();

    let earned = 0;
    let used = 0;


    data.forEach(item => {

      if (item.type === "加班") {

        earned += Number(item.hours);

      }

      if (item.type === "调休") {

        used += Number(item.hours);

      }

    });


    const balance =
      getInitial() + earned - used;


    $("balanceNumber").textContent =
      formatNumber(balance);


    $("balanceDays").textContent =
      "≈ " + hoursToDays(balance);


    $("earned").textContent =
      formatNumber(earned) + " h";


    $("used").textContent =
      formatNumber(used) + " h";


    renderMonthly(data);

    renderRecords(data);

  }


  /* =========================
     本月统计
  ========================= */

  function renderMonthly(data) {

    const now = new Date();

    const year =
      now.getFullYear();

    const month =
      String(
        now.getMonth() + 1
      ).padStart(2, "0");

    const prefix =
      year + "-" + month;


    let monthEarned = 0;
    let monthUsed = 0;


    data.forEach(item => {

      if (
        item.date &&
        item.date.startsWith(prefix)
      ) {

        if (item.type === "加班") {

          monthEarned +=
            Number(item.hours);

        }

        if (item.type === "调休") {

          monthUsed +=
            Number(item.hours);

        }

      }

    });


    $("monthText").textContent =
      year +
      "年" +
      Number(month) +
      "月";


    $("monthEarned").textContent =
      formatNumber(monthEarned) +
      " h";


    $("monthUsed").textContent =
      formatNumber(monthUsed) +
      " h";

  }


  /* =========================
     最近记录
  ========================= */

  function renderRecords(data) {

    const box = $("records");


    if (!data.length) {

      box.innerHTML =
        '<div class="empty">' +
        '还没有记录，先记录一次加班或调休吧。' +
        '</div>';

      return;

    }


    const sorted =
      [...data].sort((a, b) => {

        const aKey =
          (a.date || "") +
          (a.created || "");

        const bKey =
          (b.date || "") +
          (b.created || "");

        return bKey.localeCompare(aKey);

      });


    box.innerHTML =
      sorted.map(item => {

        const overtime =
          item.type === "加班";

        const sign =
          overtime ? "+" : "-";

        const amountClass =
          overtime ? "plus" : "minus";

        const iconClass =
          overtime ? "add" : "leave";

        const icon =
          overtime ? "+" : "−";


        return `

          <div class="record">

            <div class="record-left">

              <div class="record-icon ${iconClass}">
                ${icon}
              </div>

              <div class="record-info">

                <div class="record-type">
                  ${escapeHtml(item.type)}
                </div>

                <div class="record-meta">

                  ${escapeHtml(item.date)}

                  ${
                    item.note
                    ? " · " + escapeHtml(item.note)
                    : ""
                  }

                </div>

              </div>

            </div>


            <div class="record-right">

              <div class="record-amount ${amountClass}">

                ${sign}${formatNumber(item.hours)}h

              </div>

              <div class="record-tools">

                <button
                  class="record-tool"
                  onclick="openEdit('${item.id}')"
                >
                  编辑
                </button>

                <button
                  class="record-tool"
                  onclick="deleteRecord('${item.id}')"
                >
                  删除
                </button>

              </div>

            </div>

          </div>

        `;

      }).join("");

  }


  /* =========================
     新增加班 / 调休
  ========================= */

  function openEntry(type) {

    currentType = type;


    $("formTitle").textContent =
      "记录" + type;


    $("entryForm")
      .classList.add("show");


    const now = new Date();

    const year =
      now.getFullYear();

    const month =
      String(
        now.getMonth() + 1
      ).padStart(2, "0");

    const day =
      String(
        now.getDate()
      ).padStart(2, "0");


    $("dateInput").value =
      year +
      "-" +
      month +
      "-" +
      day;


    $("hoursInput").value = "";

    $("noteInput").value = "";


    setTimeout(() => {

      $("hoursInput").focus();

    }, 100);

  }


  function saveEntry() {

    const date =
      $("dateInput").value;

    const hours =
      Number(
        $("hoursInput").value
      );

    const note =
      $("noteInput")
        .value
        .trim();


    if (
      !date ||
      !(hours > 0)
    ) {

      alert(
        "请填写日期和有效时长"
      );

      return;

    }


    const data =
      loadRecords();


    data.push({

      id:
        Date.now().toString() +
        Math.random()
          .toString(16)
          .slice(2),

      type:
        currentType,

      date:
        date,

      hours:
        hours,

      note:
        note,

      created:
        new Date()
          .toISOString()

    });


    saveRecords(data);


    $("entryForm")
      .classList.remove("show");


    render();

  }


  /* =========================
     删除记录
  ========================= */

  function deleteRecord(id) {

    if (
      !confirm(
        "确定删除这条记录吗？"
      )
    ) {

      return;

    }


    const data =
      loadRecords()
        .filter(
          item => item.id !== id
        );


    saveRecords(data);

    render();

  }


  /* =========================
     编辑记录
  ========================= */

  function openEdit(id) {

    const data =
      loadRecords();


    const item =
      data.find(
        record => record.id === id
      );


    if (!item) {

      return;

    }


    editingId = id;


    $("editDate").value =
      item.date;


    $("editHours").value =
      item.hours;


    $("editNote").value =
      item.note || "";


    $("editModal")
      .classList.add("show");

  }


  function saveEdit() {

    const date =
      $("editDate").value;


    const hours =
      Number(
        $("editHours").value
      );


    const note =
      $("editNote")
        .value
        .trim();


    if (
      !date ||
      !(hours > 0)
    ) {

      alert(
        "请输入有效信息"
      );

      return;

    }


    const data =
      loadRecords();


    const index =
      data.findIndex(
        item =>
          item.id === editingId
      );


    if (index === -1) {

      return;

    }


    data[index].date =
      date;

    data[index].hours =
      hours;

    data[index].note =
      note;


    saveRecords(data);


    $("editModal")
      .classList.remove("show");


    editingId = null;


    render();

  }


  /* =========================
     初始余额
  ========================= */

  function setInitialBalance() {

    const value =
      prompt(
        "请输入你目前已有的调休余额（小时）",
        formatNumber(
          getInitial()
        )
      );


    if (value === null) {

      return;

    }


    const number =
      Number(value);


    if (
      Number.isNaN(number)
    ) {

      alert(
        "请输入正确的数字"
      );

      return;

    }


    localStorage.setItem(
      INITIAL_KEY,
      String(number)
    );


    render();

  }


  /* =========================
     导出备份
  ========================= */

  function exportData() {

    const payload = {

      version: 1,

      initial:
        getInitial(),

      records:
        loadRecords(),

      exportedAt:
        new Date()
          .toISOString()

    };


    const blob =
      new Blob(

        [
          JSON.stringify(
            payload,
            null,
            2
          )
        ],

        {
          type:
            "application/json"
        }

      );


    const url =
      URL.createObjectURL(blob);


    const link =
      document.createElement("a");


    link.href = url;

    link.download =
      "我的调休备份.json";


    document.body
      .appendChild(link);


    link.click();

    link.remove();


    setTimeout(
      () => {

        URL.revokeObjectURL(url);

      },
      500
    );

  }


  /* =========================
     导入备份
  ========================= */

  function importData() {

    $("fileInput").click();

  }


  $("fileInput")
    .addEventListener(
      "change",
      function(event) {

        const file =
          event.target.files[0];


        if (!file) {

          return;

        }


        const reader =
          new FileReader();


        reader.onload =
          function() {

            try {

              const data =
                JSON.parse(
                  reader.result
                );


              if (
                !Array.isArray(
                  data.records
                )
              ) {

                throw new Error();

              }


              localStorage.setItem(

                INITIAL_KEY,

                String(
                  Number(
                    data.initial || 0
                  )
                )

              );


              saveRecords(
                data.records
              );


              render();


              alert(
                "导入成功"
              );


            } catch (error) {

              alert(
                "备份文件格式不正确"
              );

            }

          };


        reader.readAsText(
          file
        );


        event.target.value = "";

      }
    );


  /* =========================
     按钮事件
  ========================= */

  $("addOvertime")
    .addEventListener(
      "click",
      () => {

        openEntry("加班");

      }
    );


  $("addLeave")
    .addEventListener(
      "click",
      () => {

        openEntry("调休");

      }
    );


  $("cancelEntry")
    .addEventListener(
      "click",
      () => {

        $("entryForm")
          .classList.remove("show");

      }
    );


  $("saveEntry")
    .addEventListener(
      "click",
      saveEntry
    );


  $("setInitial")
    .addEventListener(
      "click",
      setInitialBalance
    );


  $("exportData")
    .addEventListener(
      "click",
      exportData
    );


  $("importData")
    .addEventListener(
      "click",
      importData
    );


  $("cancelEdit")
    .addEventListener(
      "click",
      () => {

        $("editModal")
          .classList.remove("show");

        editingId = null;

      }
    );


  $("saveEdit")
    .addEventListener(
      "click",
      saveEdit
    );


  $("editModal")
    .addEventListener(
      "click",
      function(event) {

        if (
          event.target ===
          $("editModal")
        ) {

          $("editModal")
            .classList.remove("show");

          editingId = null;

        }

      }
    );


  /* 第一次打开页面 */

  render();

</script>

</body>
</html>
