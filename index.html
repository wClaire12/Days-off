<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<link rel="apple-touch-icon" href="./D1FAC0F2-8F4D-4DC4-AC2F-4672F9ED307A.png">
<link rel="icon" type="image/png" href="./D1FAC0F2-8F4D-4DC4-AC2F-4672F9ED307A.png">

<meta name="apple-mobile-web-app-title" content="我的调休">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f6f7f2">

<title>我的调休</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
:root{
 --green:#4f9165;--green2:#eaf4ed;--dark:#20231f;
 --gray:#858985;--bg:#f6f7f2;--white:#fff;
 --red:#bd5b54;--line:#eceee9
}
body{
 margin:0;background:var(--bg);color:var(--dark);
 font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif
}
button,input,textarea,select{font:inherit}
button{cursor:pointer}
.app{max-width:680px;margin:auto;padding:22px 16px 55px}
.hidden{display:none!important}

.header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:43px;height:43px;border-radius:14px;object-fit:cover}
.brand h1{font-size:22px;margin:0}
.brand p{font-size:11px;color:var(--gray);margin:4px 0 0}
.userBtn{border:0;background:#eceee9;border-radius:12px;padding:9px 11px;font-size:12px}

.card{
 background:white;border-radius:22px;padding:19px;margin-bottom:13px;
 box-shadow:0 4px 20px rgba(0,0,0,.035)
}

.balance{
 background:linear-gradient(145deg,#4d9163,#6aa67a);
 color:white;border-radius:26px;padding:23px;margin-bottom:13px
}
.balanceLabel{font-size:13px;opacity:.8}
.balanceNum{font-size:51px;font-weight:780;letter-spacing:-2px;margin-top:5px}
.balanceNum small{font-size:17px;letter-spacing:0}
.balanceDays{font-size:12px;opacity:.75;margin-top:5px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:19px}
.stat{border-top:1px solid rgba(255,255,255,.18);padding-top:13px}
.stat span{display:block;font-size:11px;opacity:.72}
.stat b{display:block;font-size:18px;margin-top:4px}

.actions{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:13px}
.mainBtn{border:0;border-radius:17px;padding:16px;font-weight:700;font-size:15px}
.green{background:var(--green);color:white}
.light{background:white;color:var(--dark)}

.sectionHead{display:flex;justify-content:space-between;align-items:center;margin-bottom:13px}
.sectionTitle{font-size:16px;font-weight:730}
.muted{font-size:11px;color:var(--gray)}

.month{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.monthBox{background:#f7f8f5;padding:14px;border-radius:15px}
.monthBox span{font-size:11px;color:var(--gray)}
.monthBox b{display:block;font-size:20px;margin-top:5px}

.quickImport{
 width:100%;border:1px solid #e3e9e3;background:#f8fbf8;
 color:#477c58;border-radius:15px;padding:13px;font-weight:650
}

.field{margin-bottom:12px}
label{display:block;font-size:11px;color:var(--gray);margin:0 0 6px 2px}
input,textarea,select{
 width:100%;border:1px solid #e1e4df;background:#fafbf8;
 border-radius:13px;padding:12px;outline:none;color:var(--dark)
}
textarea{min-height:105px;resize:vertical}
input:focus,textarea:focus{border-color:#88b398;background:white}

.formGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.full{grid-column:1/-1}
.formActions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.btn{border:0;border-radius:13px;padding:13px;font-weight:680}
.btnPrimary{background:var(--green);color:white}
.btnSoft{background:#eef0ec;color:var(--dark)}

.record{
 display:flex;justify-content:space-between;align-items:center;
 gap:10px;padding:13px 0;border-bottom:1px solid var(--line)
}
.record:last-child{border-bottom:0}
.rLeft{display:flex;align-items:center;gap:10px;min-width:0}
.rIcon{
 width:37px;height:37px;border-radius:11px;display:flex;
 align-items:center;justify-content:center;font-weight:700;flex:none
}
.rIcon.plus{background:#eaf4ed;color:#397950}
.rIcon.minus{background:#faeeee;color:var(--red)}
.rType{font-size:14px;font-weight:680}
.rMeta{
 font-size:11px;color:var(--gray);margin-top:3px;
 max-width:220px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.rAmount{text-align:right;font-size:16px;font-weight:740}
.rAmount.plus{color:#397950}.rAmount.minus{color:var(--red)}
.rTools{display:flex;justify-content:flex-end;gap:8px;margin-top:4px}
.rTools button{border:0;background:none;color:#aaa;padding:0;font-size:10px}
.empty{text-align:center;color:#aaa;font-size:12px;padding:18px}

.tools{display:flex;flex-wrap:wrap;gap:7px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line)}
.tool{border:0;background:#f1f2ef;border-radius:11px;padding:9px;font-size:11px}
.note{font-size:10px;color:#aaa;line-height:1.6;margin-top:10px}

.modal{
 position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:100;
 display:none;align-items:flex-end;justify-content:center
}
.modal.show{display:flex}
.sheet{
 width:100%;max-width:680px;background:white;border-radius:25px 25px 0 0;
 padding:21px 17px calc(23px + env(safe-area-inset-bottom));
 max-height:92vh;overflow:auto
}
.sheetTitle{font-size:19px;font-weight:740;margin-bottom:16px}

.tabs{display:grid;grid-template-columns:1fr 1fr;background:#f0f1ee;border-radius:12px;padding:3px;margin-bottom:15px}
.tab{border:0;background:transparent;padding:9px;border-radius:10px}
.tab.active{background:white;box-shadow:0 1px 5px rgba(0,0,0,.05);font-weight:700}

.authWrap{max-width:420px;margin:45px auto}
.authLogo{width:70px;height:70px;border-radius:22px;display:block;margin:0 auto 15px}
.authTitle{text-align:center;font-size:25px;font-weight:760}
.authSub{text-align:center;color:var(--gray);font-size:12px;margin:6px 0 25px}
.authSwitch{text-align:center;font-size:12px;color:var(--gray);margin-top:15px}
.authSwitch button{border:0;background:none;color:#397950;font-weight:700}

.importChoice{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.choice{
 border:1px solid #e3e5e1;background:#fafbf8;border-radius:13px;padding:12px
}
.choice.active{border-color:#6ca17c;background:#edf6ef;color:#397950}
.progress{font-size:12px;color:#477c58;margin:9px 0}
.preview{background:#f7f8f5;border-radius:13px;padding:10px;margin:10px 0}
.previewRow{display:flex;justify-content:space-between;padding:7px;border-bottom:1px solid #e7e9e5;font-size:12px}
.previewRow:last-child{border-bottom:0}

.migrate{
 background:#fff8e8;border:1px solid #f0dfb7;border-radius:16px;
 padding:14px;margin-bottom:13px;font-size:12px;line-height:1.6
}
.migrate button{margin-top:9px;width:100%}

.toast{
 position:fixed;left:50%;bottom:28px;transform:translateX(-50%);
 background:#20231f;color:white;border-radius:13px;padding:11px 15px;
 font-size:12px;z-index:999;display:none;max-width:85%;text-align:center
}

@media(min-width:700px){
 .modal{align-items:center;padding:20px}
 .sheet{max-width:520px;border-radius:25px}
}
</style>
</head>

<body>

<!-- 登录 -->
<div id="authPage" class="app hidden">
 <div class="authWrap">
  <img class="authLogo" src="./D1FAC0F2-8F4D-4DC4-AC2F-4672F9ED307A.png">
  <div class="authTitle">我的调休</div>
  <div class="authSub">登录后，手机和电脑自动同步</div>

  <div class="card">
   <div id="authHeading" class="sectionTitle" style="margin-bottom:16px">登录</div>

   <div class="field">
    <label>邮箱</label>
    <input id="authEmail" type="email" placeholder="请输入邮箱">
   </div>

   <div class="field">
    <label>密码</label>
    <input id="authPassword" type="password" placeholder="至少 6 位密码">
   </div>

   <button id="authSubmit" class="btn btnPrimary" style="width:100%">登录</button>

   <div class="authSwitch">
    <span id="authSwitchText">第一次使用？</span>
    <button id="authSwitch">注册账号</button>
   </div>
  </div>
 </div>
</div>


<!-- 主页面 -->
<div id="mainPage" class="app hidden">

 <div class="header">
  <div class="brand">
   <img class="logo" src="./D1FAC0F2-8F4D-4DC4-AC2F-4672F9ED307A.png">
   <div>
    <h1>我的调休</h1>
    <p id="syncText">云端同步</p>
   </div>
  </div>
  <button id="accountBtn" class="userBtn">账号</button>
 </div>

 <div id="migrateBox" class="migrate hidden">
  检测到这台设备上还有旧版“我的调休”记录。
  可以一键上传到你的云端账号，原来的本地数据不会立即删除。
  <button id="migrateBtn" class="btn btnPrimary">同步旧记录到云端</button>
 </div>

 <div class="balance">
  <div class="balanceLabel">当前可调休</div>
  <div class="balanceNum"><span id="balanceNumber">0</span> <small>小时</small></div>
  <div id="balanceDays" class="balanceDays">≈ 0天 0小时</div>

  <div class="stats">
   <div class="stat"><span>累计加班</span><b id="earned">0 h</b></div>
   <div class="stat"><span>累计已休</span><b id="used">0 h</b></div>
  </div>
 </div>

 <div class="actions">
  <button id="addOvertime" class="mainBtn green">＋ 记录加班</button>
  <button id="addLeave" class="mainBtn light">－ 记录调休</button>
 </div>

 <div class="card">
  <button id="openImport" class="quickImport">📷 钉钉快速导入 / 🎙️ 一句话记录</button>
 </div>

 <div class="card">
  <div class="sectionHead">
   <div class="sectionTitle">本月统计</div>
   <div id="monthText" class="muted"></div>
  </div>
  <div class="month">
   <div class="monthBox"><span>本月加班</span><b id="monthEarned">0 h</b></div>
   <div class="monthBox"><span>本月调休</span><b id="monthUsed">0 h</b></div>
  </div>
 </div>

 <div class="card">
  <div class="sectionHead">
   <div class="sectionTitle">最近记录</div>
   <div class="muted">已云端同步</div>
  </div>

  <div id="records"></div>

  <div class="tools">
   <button id="setInitial" class="tool">设置初始余额</button>
   <button id="exportData" class="tool">导出备份</button>
   <button id="refreshData" class="tool">刷新同步</button>
  </div>

  <div class="note">
   登录后的记录保存在你的云端账号中。同一个账号在手机和电脑登录即可同步；
   其他用户登录自己的账号，只能看到自己的数据。
  </div>
 </div>
</div>


<!-- 新增/编辑 -->
<div id="entryModal" class="modal">
 <div class="sheet">
  <div id="entryTitle" class="sheetTitle">记录加班</div>

  <div class="formGrid">
   <div class="field">
    <label>日期</label>
    <input id="dateInput" type="date">
   </div>
   <div class="field">
    <label>时长（小时）</label>
    <input id="hoursInput" type="number" min=".25" step=".25" inputmode="decimal">
   </div>
   <div class="field full">
    <label>备注（可选）</label>
    <input id="noteInput" maxlength="80" placeholder="例如：晚上加班">
   </div>
  </div>

  <div class="formActions">
   <button id="cancelEntry" class="btn btnSoft">取消</button>
   <button id="saveEntry" class="btn btnPrimary">保存</button>
  </div>
 </div>
</div>


<!-- 快速导入 -->
<div id="importModal" class="modal">
 <div class="sheet">
  <div class="sheetTitle">快速录入</div>

  <div class="tabs">
   <button class="tab active" data-tab="screenshot">钉钉截图</button>
   <button class="tab" data-tab="text">文字 / 语音</button>
  </div>

  <div id="screenshotTab">
   <div class="muted" style="margin-bottom:11px">
    先告诉我这张截图是哪一种记录，再选择钉钉截图，识别会更准确。
   </div>

   <div class="importChoice">
    <button class="choice active" data-type="加班">加班截图</button>
    <button class="choice" data-type="调休">调休截图</button>
   </div>

   <input id="imageInput" type="file" accept="image/*">

   <div id="ocrProgress" class="progress hidden"></div>

   <div id="ocrPreview" class="preview hidden"></div>

   <button id="importRecognized" class="btn btnPrimary hidden" style="width:100%">
    确认导入识别结果
   </button>
  </div>

  <div id="textTab" class="hidden">
   <div class="field">
    <label>输入一句话，或粘贴钉钉审批文字</label>
    <textarea id="quickText" placeholder="例如：9月17日加班2小时&#10;或者：今天调休1.5小时"></textarea>
   </div>

   <div class="formActions">
    <button id="voiceBtn" class="btn btnSoft">🎙️ 语音输入</button>
    <button id="parseTextBtn" class="btn btnPrimary">识别内容</button>
   </div>

   <div id="textPreview" class="preview hidden"></div>

   <button id="importTextResult" class="btn btnPrimary hidden" style="width:100%">
    确认导入
   </button>
  </div>

  <button id="closeImport" class="btn btnSoft" style="width:100%;margin-top:12px">
   关闭
  </button>
 </div>
</div>


<!-- 账号 -->
<div id="accountModal" class="modal">
 <div class="sheet">
  <div class="sheetTitle">我的账号</div>
  <div class="card" style="box-shadow:none;background:#f7f8f5">
   <div class="muted">当前登录</div>
   <div id="accountEmail" style="font-weight:650;margin-top:5px;word-break:break-all"></div>
  </div>
  <button id="logoutBtn" class="btn btnSoft" style="width:100%">退出登录</button>
  <button id="closeAccount" class="btn btnPrimary" style="width:100%;margin-top:8px">返回</button>
 </div>
</div>

<div id="toast" class="toast"></div>

<script>
const SUPABASE_URL = "https://zzewoqlhylheggocfzyj.supabase.co";
const SUPABASE_KEY = "sb_publishable_DXztYtYfmYqCwJav02eLqA_1mHvrLrt";

const db = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
 auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}
});

const OLD_RECORD_KEY="my_timeoff_records_v1";
const OLD_INITIAL_KEY="my_timeoff_initial_v1";

const $=id=>document.getElementById(id);

let user=null;
let records=[];
let initialBalance=0;
let entryType="加班";
let editingId=null;
let authMode="login";
let importType="加班";
let recognized=[];
let parsedText=[];

function toast(text){
 const el=$("toast");
 el.textContent=text;
 el.style.display="block";
 clearTimeout(window.toastTimer);
 window.toastTimer=setTimeout(()=>el.style.display="none",2500);
}

function fmt(n){
 n=Math.round((Number(n)+Number.EPSILON)*100)/100;
 return String(n);
}

function dayText(hours){
 const neg=hours<0?"-":"";
 const h=Math.abs(hours);
 return neg+Math.floor(h/8)+"天 "+fmt(h%8)+"小时";
}

function today(){
 const d=new Date();
 const y=d.getFullYear();
 const m=String(d.getMonth()+1).padStart(2,"0");
 const day=String(d.getDate()).padStart(2,"0");
 return `${y}-${m}-${day}`;
}

function escapeHtml(s){
 return String(s||"").replace(/[&<>"']/g,m=>({
  "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
 })[m]);
}

async function start(){
 const {data}=await db.auth.getSession();
 if(data.session){
  await enterApp(data.session.user);
 }else{
  showAuth();
 }
}

function showAuth(){
 $("mainPage").classList.add("hidden");
 $("authPage").classList.remove("hidden");
}

async function enterApp(u){
 user=u;
 $("authPage").classList.add("hidden");
 $("mainPage").classList.remove("hidden");
 $("accountEmail").textContent=user.email||"";
 await loadCloud();
 checkOldData();
}

$("authSwitch").onclick=()=>{
 authMode=authMode==="login"?"signup":"login";
 const signup=authMode==="signup";
 $("authHeading").textContent=signup?"注册账号":"登录";
 $("authSubmit").textContent=signup?"注册":"登录";
 $("authSwitchText").textContent=signup?"已经有账号？":"第一次使用？";
 $("authSwitch").textContent=signup?"返回登录":"注册账号";
};

$("authSubmit").onclick=async()=>{
 const email=$("authEmail").value.trim();
 const password=$("authPassword").value;

 if(!email||password.length<6){
  toast("请输入正确邮箱和至少 6 位密码");
  return;
 }

 $("authSubmit").disabled=true;

 try{
  if(authMode==="signup"){
   const {data,error}=await db.auth.signUp({
    email,password,
    options:{emailRedirectTo:"https://wclaire12.github.io/Days-off/"}
   });
   if(error) throw error;

   if(data.session){
    await enterApp(data.user);
   }else{
    alert("注册成功。请打开邮箱里的验证邮件，点击确认后再回来登录。");
    authMode="login";
    $("authHeading").textContent="登录";
    $("authSubmit").textContent="登录";
    $("authSwitchText").textContent="第一次使用？";
    $("authSwitch").textContent="注册账号";
   }
  }else{
   const {data,error}=await db.auth.signInWithPassword({email,password});
   if(error) throw error;
   await enterApp(data.user);
  }
 }catch(e){
  alert("操作失败：" + e.message);
 }finally{
  $("authSubmit").disabled=false;
 }
};

async function loadCloud(){
 $("syncText").textContent="正在同步…";

 const [r,s]=await Promise.all([
  db.from("timeoff_records")
   .select("*")
   .order("record_date",{ascending:false})
   .order("created_at",{ascending:false}),
  db.from("timeoff_settings")
   .select("initial_balance")
   .eq("user_id",user.id)
   .maybeSingle()
 ]);

 if(r.error){
  console.error(r.error);
  alert("读取记录失败：" + r.error.message);
  return;
 }

 records=r.data||[];
 initialBalance=s.data?Number(s.data.initial_balance):0;

 $("syncText").textContent="已云端同步";
 render();
}

function render(){
 let earned=0,used=0;

 records.forEach(r=>{
  if(r.type==="加班") earned+=Number(r.hours);
  else if(r.type==="调休") used+=Number(r.hours);
 });

 const balance=initialBalance+earned-used;
 $("balanceNumber").textContent=fmt(balance);
 $("balanceDays").textContent="≈ "+dayText(balance);
 $("earned").textContent=fmt(earned)+" h";
 $("used").textContent=fmt(used)+" h";

 const d=new Date();
 const y=d.getFullYear();
 const m=String(d.getMonth()+1).padStart(2,"0");
 const prefix=`${y}-${m}`;

 let me=0,mu=0;
 records.forEach(r=>{
  if(String(r.record_date).startsWith(prefix)){
   if(r.type==="加班") me+=Number(r.hours);
   else mu+=Number(r.hours);
  }
 });

 $("monthText").textContent=`${y}年${Number(m)}月`;
 $("monthEarned").textContent=fmt(me)+" h";
 $("monthUsed").textContent=fmt(mu)+" h";

 renderRecords();
}

function renderRecords(){
 if(!records.length){
  $("records").innerHTML='<div class="empty">还没有记录，先记一次加班或调休吧。</div>';
  return;
 }

 $("records").innerHTML=records.map(r=>{
  const plus=r.type==="加班";
  return `
  <div class="record">
   <div class="rLeft">
    <div class="rIcon ${plus?"plus":"minus"}">${plus?"+":"−"}</div>
    <div>
     <div class="rType">${escapeHtml(r.type)}</div>
     <div class="rMeta">${escapeHtml(r.record_date)}${r.note?" · "+escapeHtml(r.note):""}</div>
    </div>
   </div>
   <div>
    <div class="rAmount ${plus?"plus":"minus"}">${plus?"+":"-"}${fmt(r.hours)}h</div>
    <div class="rTools">
     <button onclick="editRecord('${r.id}')">编辑</button>
     <button onclick="deleteRecord('${r.id}')">删除</button>
    </div>
   </div>
  </div>`;
 }).join("");
}

function openEntry(type){
 entryType=type;
 editingId=null;
 $("entryTitle").textContent="记录"+type;
 $("dateInput").value=today();
 $("hoursInput").value="";
 $("noteInput").value="";
 $("entryModal").classList.add("show");
 setTimeout(()=>$("hoursInput").focus(),100);
}

$("addOvertime").onclick=()=>openEntry("加班");
$("addLeave").onclick=()=>openEntry("调休");
$("cancelEntry").onclick=()=>$("entryModal").classList.remove("show");

$("saveEntry").onclick=async()=>{
 const date=$("dateInput").value;
 const hours=Number($("hoursInput").value);
 const note=$("noteInput").value.trim();

 if(!date||!(hours>0)){
  toast("请填写日期和有效时长");
  return;
 }

 let result;

 if(editingId){
  result=await db.from("timeoff_records")
   .update({record_date:date,hours,note})
   .eq("id",editingId);
 }else{
  result=await db.from("timeoff_records").insert({
   user_id:user.id,type:entryType,record_date:date,hours,note
  });
 }

 if(result.error){
  alert("保存失败："+result.error.message);
  return;
 }

 $("entryModal").classList.remove("show");
 toast("已保存并同步");
 await loadCloud();
};

 const r=records.find(x=>x.id===id);
 if(!r)return;

 editingId=id;
 entryType=r.type;

 if(error){

/* ===== 旧版数据迁移 ===== */

function oldData(){
 try{
  return JSON.parse(localStorage.getItem(OLD_RECORD_KEY)||"[]");
 }catch(e){return []}
}

function checkOldData(){
 const old=oldData();
 const done=localStorage.getItem("timeoff_migrated_"+user.id);
 $("migrateBox").classList.toggle("hidden",!old.length||!!done);
}

$("migrateBtn").onclick=async()=>{
 const old=oldData();
 const oldInitial=Number(localStorage.getItem(OLD_INITIAL_KEY)||0);

 if(!old.length){
  toast("没有发现旧记录");
  return;
 }

 if(!confirm(`发现 ${old.length} 条旧记录，确定上传到当前账号吗？`))return;

 $("migrateBtn").disabled=true;
 $("migrateBtn").textContent="正在同步…";

 const rows=old
  .filter(x=>x.date&&Number(x.hours)>0&&(x.type==="加班"||x.type==="调休"))
  .map(x=>({
   user_id:user.id,
   type:x.type,
   record_date:x.date,
   hours:Number(x.hours),
   note:x.note||"旧版导入"
  }));

 const {error}=await db.from("timeoff_records").insert(rows);

 if(error){
  alert("旧记录同步失败："+error.message);
  $("migrateBtn").disabled=false;
  $("migrateBtn").textContent="同步旧记录到云端";
  return;
 }

 if(oldInitial!==0){
  await db.from("timeoff_settings").upsert({
   user_id:user.id,
   initial_balance:oldInitial,
   updated_at:new Date().toISOString()
  },{onConflict:"user_id"});
 }

 localStorage.setItem("timeoff_migrated_"+user.id,"1");
 $("migrateBox").classList.add("hidden");
 toast("旧记录已同步到云端");
 await loadCloud();
};

function normalizeDate(y,m,d){
 const now=new Date();
 y=y?Number(y):now.getFullYear();
 m=String(Number(m)).padStart(2,"0");
 d=String(Number(d)).padStart(2,"0");
 return `${y}-${m}-${d}`;
}

function parseNaturalText(text,forcedType=null){
 text=String(text||"")
  .replace(/[：]/g,":")
  .replace(/\s+/g," ");

 let type=forcedType;
 if(!type){
  if(/调休|请假/.test(text))type="调休";
  else if(/加班/.test(text))type="加班";
 }

 if(!type)return [];

 let date=today();

 const full=text.match(/(20\d{2})[年\-\/.](\d{1,2})[月\-\/.](\d{1,2})/);
 const short=text.match(/(\d{1,2})月(\d{1,2})[日号]?/);

 if(full)date=normalizeDate(full[1],full[2],full[3]);
 else if(short)date=normalizeDate(null,short[1],short[2]);
 else if(/昨天/.test(text)){
  const d=new Date();d.setDate(d.getDate()-1);
  date=`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
 }

 let hours=null;

 const h=text.match(/(?:时长|共计|合计)?\s*[:：]?\s*(\d+(?:\.\d+)?)\s*(?:小时|h|H)/);
 if(h)hours=Number(h[1]);

 if(!hours){
  const num=text.match(/(?:加班|调休|请假)[^\d]{0,8}(\d+(?:\.\d+)?)/);
  if(num)hours=Number(num[1]);
 }

 if(!hours||hours<=0)return [];

 return [{type,date,hours,note:"快速录入"}];
}

/* 尝试从 OCR 文本中识别多条日期 + 时长 */
function parseOCR(text,type){
 const lines=String(text||"").split(/\n+/).map(x=>x.trim()).filter(Boolean);
 const result=[];

 for(let i=0;i<lines.length;i++){
  const area=lines.slice(Math.max(0,i-3),Math.min(lines.length,i+5)).join(" ");

  const dateMatch=area.match(/(20\d{2})[\-\/.年](\d{1,2})[\-\/.月](\d{1,2})/);
  const hourMatch=area.match(/(?:时长|小时|duration)?[^\d]{0,8}(\d+(?:\.\d+)?)\s*(?:小时|h|H)/i);

  if(dateMatch&&hourMatch){
   const item={
    type,
    date:normalizeDate(dateMatch[1],dateMatch[2],dateMatch[3]),
    hours:Number(hourMatch[1]),
    note:"钉钉截图导入"
   };

   if(item.hours>0&&!result.some(x=>x.date===item.date&&x.hours===item.hours)){
    result.push(item);
   }
  }
 }

 /* 单条截图兜底 */
 if(!result.length){
  const one=parseNaturalText(text,type);
  return one;
 }

 return result;
}

function showPreview(boxId,buttonId,data){
 const box=$(boxId);
 const btn=$(buttonId);

 if(!data.length){
  box.classList.remove("hidden");
  box.innerHTML="没有可靠识别到日期和时长。可以切换到“文字 / 语音”快速录入。";
  btn.classList.add("hidden");
  return;
 }

 box.innerHTML=data.map(x=>`
  <div class="previewRow">
   <span>${escapeHtml(x.date)} · ${escapeHtml(x.type)}</span>
   <b>${fmt(x.hours)}h</b>
  </div>
 `).join("");

 box.classList.remove("hidden");
 btn.classList.remove("hidden");
}

$("imageInput").onchange=async e=>{
 const file=e.target.files[0];
 if(!file)return;

 recognized=[];
 $("ocrPreview").classList.add("hidden");
 $("importRecognized").classList.add("hidden");
 $("ocrProgress").classList.remove("hidden");
 $("ocrProgress").textContent="正在识别截图，第一次使用可能需要几十秒…";

 try{
  const result=await Tesseract.recognize(file,"chi_sim+eng",{
   logger:m=>{
    if(m.status==="recognizing text"){
     $("ocrProgress").textContent=`正在识别… ${Math.round((m.progress||0)*100)}%`;
    }
   }
  });

  recognized=parseOCR(result.data.text,importType);
  $("ocrProgress").textContent=`识别完成，共找到 ${recognized.length} 条记录`;
  showPreview("ocrPreview","importRecognized",recognized);

 }catch(err){
  console.error(err);
  $("ocrProgress").textContent="截图识别失败，请使用文字 / 语音录入。";
 }
};

async function insertMany(items){
 if(!items.length)return false;

 const rows=items.map(x=>({
  user_id:user.id,
  type:x.type,
  record_date:x.date,
  hours:Number(x.hours),
  note:x.note||"快速导入"
 }));

 const {error}=await db.from("timeoff_records").insert(rows);

 if(error){
  alert("导入失败："+error.message);
  return false;
 }

 await loadCloud();
 return true;
}

$("importRecognized").onclick=async()=>{
 if(await insertMany(recognized)){
  toast(`已导入 ${recognized.length} 条记录`);
  $("importModal").classList.remove("show");
  $("imageInput").value="";
 }
};

$("parseTextBtn").onclick=()=>{
 parsedText=parseNaturalText($("quickText").value);
 showPreview("textPreview","importTextResult",parsedText);
};

$("importTextResult").onclick=async()=>{
 if(await insertMany(parsedText)){
  toast("记录已保存并同步");
  $("importModal").classList.remove("show");
  $("quickText").value="";
 }
};

/* 语音 */
$("voiceBtn").onclick=()=>{
 const SpeechRecognition=window.SpeechRecognition||window.webkitSpeechRecognition;

 if(!SpeechRecognition){
  toast("当前浏览器不支持网页语音识别，可以直接输入文字");
  return;
 }

 const recognition=new SpeechRecognition();
 recognition.lang="zh-CN";
 recognition.interimResults=false;

 $("voiceBtn").textContent="正在听…";

 recognition.onresult=e=>{
  const text=e.results[0][0].transcript;
  $("quickText").value=text;
  $("voiceBtn").textContent="🎙️ 语音输入";
  parsedText=parseNaturalText(text);
  showPreview("textPreview","importTextResult",parsedText);
 };

 recognition.onerror=()=>{
  $("voiceBtn").textContent="🎙️ 语音输入";
  toast("没有识别成功，请再试一次");
 };

 recognition.onend=()=>{
  $("voiceBtn").textContent="🎙️ 语音输入";
 };

 recognition.start();
};

db.auth.onAuthStateChange((event,session)=>{
 if(event==="SIGNED_OUT")showAuth();
});

start();
